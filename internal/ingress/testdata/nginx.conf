# Generated by clowdrd. Do not edit: changes are overwritten on the next deploy.
worker_processes auto;
worker_rlimit_nofile 65535;
worker_shutdown_timeout 30s;
pid /var/run/nginx.pid;
error_log syslog:server=unix:/run/clowdr/log.sock,tag=nginx,nohostname warn;

events {
    worker_connections 16384;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;
    # One shared nginx serves every project: slow or piled-up connections from one client
    # must not use up its connections. The limit counts real client IPs (after real_ip).
    client_header_timeout 15s;
    limit_conn_zone $binary_remote_addr zone=clowdr_conn:10m;
    limit_conn clowdr_conn 256;
    limit_conn_status 429;
    server_names_hash_bucket_size 128;

    # Docker's embedded DNS: upstream container names are re-resolved, so a missing
    # container never stops nginx from starting.
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }
    map $http_x_forwarded_proto $clowdr_forwarded_proto {
        default $http_x_forwarded_proto;
        ''      $scheme;
    }

    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    geo $realip_remote_addr $clowdr_via_proxy {
        default 0;
        127.0.0.0/8 1;
        10.0.0.0/8 1;
        172.16.0.0/12 1;
        192.168.0.0/16 1;
        ::1/128 1;
        fc00::/7 1;
        173.245.48.0/20 1;
        103.21.244.0/22 1;
        103.22.200.0/22 1;
        103.31.4.0/22 1;
        141.101.64.0/18 1;
        108.162.192.0/18 1;
        190.93.240.0/20 1;
        188.114.96.0/20 1;
        197.234.240.0/22 1;
        198.41.128.0/17 1;
        162.158.0.0/15 1;
        104.16.0.0/13 1;
        104.24.0.0/14 1;
        172.64.0.0/13 1;
        131.0.72.0/22 1;
        2400:cb00::/32 1;
        2606:4700::/32 1;
        2803:f800::/32 1;
        2405:b500::/32 1;
        2405:8100::/32 1;
        2a06:98c0::/29 1;
        2c0f:f248::/32 1;
    }

    log_format json_combined escape=json '{"time":"$time_iso8601","ip":"$remote_addr",'
        '"host":"$host","method":"$request_method","uri":"$request_uri","status":$status,'
        '"bytes":$body_bytes_sent,"rt":$request_time,"urt":"$upstream_response_time",'
        '"ref":"$http_referer","ua":"$http_user_agent","country":"$http_cf_ipcountry"}';
    access_log syslog:server=unix:/run/clowdr/log.sock,tag=access,nohostname json_combined;

    # Unknown hosts are dropped.
    server {
        listen 80 default_server;
        server_name _;
        location ^~ /.well-known/acme-challenge/ {
            proxy_pass http://unix:/run/clowdr/api.sock;
        }
        location / {
            return 444;
        }
    }

    server {
        listen 80;
        server_name deploy.example.com;
        location ^~ /.well-known/acme-challenge/ {
            proxy_pass http://unix:/run/clowdr/api.sock;
        }
        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name deploy.example.com;
        ssl_certificate /var/lib/clowdr/certs/deploy.example.com/fullchain.pem;
        ssl_certificate_key /var/lib/clowdr/certs/deploy.example.com/privkey.pem;
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        location / {
            proxy_pass http://unix:/run/clowdr/api.sock;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
        }
    }

    include /etc/clowdr/nginx/conf.d/*.conf;
}
