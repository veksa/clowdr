version: 2
project_name: clowdr

builds:
  - id: clowdrd
    main: ./cmd/clowdr
    binary: clowdrd
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{ .Version }}"]
    goos: [linux]
    goarch: [amd64, arm64]
  - id: clowctl
    main: ./cmd/clowdr
    binary: clowctl
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{ .Version }}"]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  # Plain binaries: install.sh and `self-update` download them directly.
  - id: raw
    formats: [binary]
    name_template: "{{ .Binary }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

# checksums.txt.sig: ed25519 over checksums.txt. install.sh and `clowctl self-update` refuse a
# release without it; the public key is in both. The release workflow puts the private key
# (secret CLOWDR_SIGNING_KEY, PEM) into a file for openssl.
signs:
  - id: checksums
    artifacts: checksum
    signature: "${artifact}.sig"
    cmd: openssl
    args: ["pkeyutl", "-sign", "-rawin", "-inkey", "{{ .Env.CLOWDR_SIGNING_KEY_FILE }}", "-in", "${artifact}", "-out", "${signature}"]

release:
  extra_files:
    - glob: ./install.sh

changelog:
  use: git
  sort: asc
