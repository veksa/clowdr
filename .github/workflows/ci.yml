name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race -coverprofile=cover.out ./...
      - run: go tool cover -func=cover.out | tail -1

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -trimpath -o /dev/null ./cmd/clowdr

  # CLI on every OS: unit tests natively (paths, cmd /C vs sh -c).
  cli:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./internal/cli/... ./internal/config/... ./internal/api/...

  # The whole path on a real host: Docker 29 + containerd store, install.sh, nginx, registry,
  # deploys under load, rollback, scale, logs (test/e2e/run.sh).
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: CGO_ENABLED=0 go build -trimpath -ldflags "-X main.version=e2e" -o clowdrd ./cmd/clowdr
      - run: sudo CLOWDR_BINARY=$PWD/clowdrd test/e2e/run.sh
      # The registry against docker's containerd content store (root-only socket).
      - run: |
          go test -c -o registry.test ./internal/registry
          sudo CLOWDR_CONTAINERD=/run/containerd/containerd.sock ./registry.test -test.run Containerd -test.v
