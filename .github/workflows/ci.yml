name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      # Unit and integration tests (the docker, Pebble and registry ones use the runner's docker).
      # Coverage counts code exercised from any package (the CLI tests drive the API), without
      # the test helpers.
      - run: go test -race -coverpkg=$(go list ./internal/... | grep -v -e /apitest -e /fake | paste -sd, -) -coverprofile=cover.out ./...
      - name: coverage gate
        run: |
          total=$(go tool cover -func=cover.out | tail -1 | awk '{print int($NF)}')
          echo "coverage: $total% (gate 74%, target 80%)"
          [ "$total" -ge 74 ]

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -trimpath -o /dev/null ./cmd/clowdr

  # clowdr-node: build and test it, and check that the tarball clowdrd embeds and serves
  # (internal/sdk/files) is what the sources build: a change to src/ needs a new version
  # packed with sdk/node/pack.sh.
  sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm test
      - name: embedded package matches the sources
        run: |
          v=$(node -p "require('./package.json').version")
          cat ../../docs/tracing.md ../../docs/metrics.md > README.md
          cmp README.md ../../internal/sdk/files/README.md || { echo "internal/sdk/files/README.md is stale: run sdk/node/pack.sh"; exit 1; }
          mkdir -p /tmp/pack/built /tmp/pack/embedded
          npm pack --pack-destination /tmp/pack >/dev/null
          tar -xzf "/tmp/pack/clowdr-node-$v.tgz" -C /tmp/pack/built
          tar -xzf "../../internal/sdk/files/clowdr-node-$v.tgz" -C /tmp/pack/embedded \
            || { echo "clowdr-node $v is not in internal/sdk/files: run sdk/node/pack.sh"; exit 1; }
          diff -r /tmp/pack/built /tmp/pack/embedded \
            || { echo "src/ changed but clowdr-node $v was not repacked: bump the version, run sdk/node/pack.sh"; exit 1; }

  # CLI on every OS: unit tests natively (paths, cmd /C vs sh -c).
  cli:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./internal/cli/... ./internal/config/... ./internal/api/...

  # The whole path on a real host: Docker 29 + containerd store, install.sh, nginx, registry,
  # deploys under load, rollback, scale, logs (test/e2e/run.sh).
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: CGO_ENABLED=0 go build -trimpath -ldflags "-X main.version=e2e" -o clowdrd ./cmd/clowdr
      - run: sudo CLOWDR_BINARY="$PWD/clowdrd" test/e2e/run.sh
      # The registry against docker's containerd content store (root-only socket).
      - run: |
          go test -c -o registry.test ./internal/registry
          sudo CLOWDR_CONTAINERD=/run/containerd/containerd.sock ./registry.test -test.run Containerd -test.v

  # The release build, without publishing or signing: a broken .goreleaser.yaml shows up here,
  # not when a tag is pushed.
  release-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --snapshot --clean --skip=publish,sign
