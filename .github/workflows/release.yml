name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - name: signing key
        env:
          KEY: ${{ secrets.CLOWDR_SIGNING_KEY }}
        run: |
          test -n "$KEY" || { echo "secret CLOWDR_SIGNING_KEY is not set"; exit 1; }
          umask 077
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/signing-key.pem"
          echo "CLOWDR_SIGNING_KEY_FILE=$RUNNER_TEMP/signing-key.pem" >> "$GITHUB_ENV"
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
