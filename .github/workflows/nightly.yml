name: nightly

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - { pkg: ./internal/config, fn: FuzzParseDeploy }
          - { pkg: ./internal/config, fn: FuzzParsePlatform }
          - { pkg: ./internal/config, fn: FuzzUnits }
          - { pkg: ./internal/logs, fn: FuzzMsgpack }
          - { pkg: ./internal/logs, fn: FuzzParseSyslog }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ${{ matrix.target.pkg }} -run '^$' -fuzz '^${{ matrix.target.fn }}$' -fuzztime 5m
      # A failing input is written to testdata/fuzz: commit it as a regression test.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-${{ matrix.target.fn }}
          path: "**/testdata/fuzz/**"
